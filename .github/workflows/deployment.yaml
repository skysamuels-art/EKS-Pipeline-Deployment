name: deployment

on:
  push:
    branches: [gitops]
    paths-ignore:
      - 'k8s/**'        # the bot edits k8s/, so ignoring it prevents an endless loop

permissions:
  id-token: write       # lets GitHub show its pass to AWS
  contents: write       # lets the bot save the new tag to Git

env:
  AWS_REGION: us-west-1
  ECR_REPO: hello-world

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:$TAG .
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:$TAG
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Save new tag in Git
        run: |
          sed -i -E "s|^([[:space:]]*)tag:.*|\1tag: \"$TAG\"|" k8s/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/values.yaml
          git commit -m "Update image tag to $TAG"
          git push